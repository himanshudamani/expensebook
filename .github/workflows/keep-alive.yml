name: Keep Supabase awake

# Supabase pauses free projects after 7 days without activity.
# A tiny read every 3 days keeps it running.
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl --fail --silent --show-error --max-time 30 \
            "${{ vars.VITE_SUPABASE_URL }}/rest/v1/ledgers?select=id&limit=1" \
            -H "apikey: ${{ vars.VITE_SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "HTTP %{http_code}\n"
